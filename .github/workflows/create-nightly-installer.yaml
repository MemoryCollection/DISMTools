name: Create Nightly Installer

on:
  push:
    branches:
      - dt_prerel_*
      - dt_rel*
    paths-ignore:
      - '.github/**'
      - '**/README.md'
      - 'res/**'
  workflow_dispatch:
env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-runspace:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        submodules: 'true'
    - name: Set up MSBuild
      uses: microsoft/Setup-MSBuild@v2
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    - name: Prepare NuGet packages
      run: |
        .\nugetpkgprep.bat
        nuget restore packages.config -PackagesDirectory packages
      continue-on-error: false
    - name: Generate installer
      run: |
        $ghAction = "yes"
        $solutionDir = "$((Get-Location).Path)\"
        $projectDir = "$((Get-Location).Path)\"
        $targetDir = (Get-Location).Path + "\bin\Debug\"
        Write-Output "=== Running CheckMissingDlls.ps1 ==="
        try { iex "$($solutionDir)CheckMissingDlls.ps1" } catch { Write-Output "::error::CheckMissingDlls.ps1 failed: $_" }
        Write-Output "=== Building BDELib dependency ==="
        msbuild Tools\BDELib\BDELib.vbproj /p:Configuration=Debug /p:Platform=AnyCPU 2>&1 | ForEach-Object {
          Write-Output $_
          if ($_ -match "error|BC[0-9]{4}") { Write-Output "::error::$_" }
        }
        if (-not (Test-Path "bin\Debug\BDELib.dll")) {
          New-Item -ItemType Directory -Force -Path "bin\Debug" | Out-Null
          Copy-Item "Tools\BDELib\bin\Debug\BDELib.dll" "bin\Debug\BDELib.dll" -Force
        }
        Write-Output "=== Running msbuild (DISMTools) ==="
        msbuild DISMTools.vbproj /p:Configuration=Debug /p:DeployOnBuild=true /p:SolutionDir=$solutionDir /p:ProjectDir=$projectDir /p:TargetDir=$targetDir 2>&1 | ForEach-Object {
          Write-Output $_
          if ($_ -match "error|BC[0-9]{4}|exited with code") { Write-Output "::error::$_" }
        }
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-result
        path: ${{ github.workspace }}\Installer\Output\dt_setup.exe
  upload-installer:
    runs-on: ubuntu-latest
    needs: build-runspace
    # 构建产物直接发布到当前仓库的 GitHub Release（使用仓库自带 GITHUB_TOKEN，
    # 不依赖任何外部仓库或部署密钥）。
    permissions:
      contents: write
    steps:
      - name: Grab Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-result
          path: ./downloaded_artifacts
      - name: Publish installer to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: nightly-${{ github.ref_name }}
        run: |
          set -e
          ls -l ./downloaded_artifacts
          # 覆盖发布：先删除同名 release 与 tag（不存在时忽略）
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$TAG" ./downloaded_artifacts/dt_setup.exe \
            --repo "${{ github.repository }}" \
            --title "Nightly build (${{ github.ref_name }})" \
            --notes "自动构建产物 | 分支: ${{ github.ref_name }} | 提交: ${{ github.sha }}" \
            --prerelease
          echo "::notice::Installer 已发布到 https://github.com/${{ github.repository }}/releases/tag/$TAG"
